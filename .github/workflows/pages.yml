name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/announcements.json"
      - ".github/workflows/pages.yml"
  # 每日排程用 GITHUB_TOKEN push 資料，不會觸發 push 事件；改用 workflow_run 在排程跑完後重新部署
  workflow_run:
    workflows: ["Daily regulator pipeline"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # 拿排程剛 commit 的最新資料，而不是觸發當下的舊 commit

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
