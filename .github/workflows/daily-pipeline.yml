name: Daily regulator pipeline

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily; GitHub often starts scheduled runs hours late
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python3 -m unittest discover tests

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline.py

      - name: Export JSON for the web dashboard
        run: python3 export_json.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/announcements.db data/announcements.json
          git diff --cached --quiet && echo "No new announcements, nothing to commit." || git commit -m "Auto-update: new FCA/SEC announcements $(date -u +%Y-%m-%d)"
          # 執行期間若有人 push 了程式碼，先接上最新的 main；兩邊都改到資料庫時會直接失敗，而不是覆蓋掉對方
          git pull --rebase
          git push
